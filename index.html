<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牠們在看｜真相抽選</title>

<style>
body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial, "Noto Sans TC", sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.container{
  width:90%;
  max-width:520px;
  padding:30px;
}

h1{
  font-size:32px;
  margin-bottom:12px;
}

p{
  opacity:.75;
  line-height:1.8;
}

.slot{
  margin:35px auto 20px;
  padding:28px 20px;
  border:2px solid #fff;
  border-radius:18px;
  min-height:110px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  font-weight:bold;
  line-height:1.5;
  background:#111;
  box-shadow:0 0 20px rgba(255,255,255,.15);
}

button{
  margin-top:25px;
  padding:16px 44px;
  border:none;
  border-radius:999px;
  background:white;
  color:black;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.status{
  margin-top:18px;
  font-size:14px;
  opacity:.55;
}

.result-title{
  margin-top:26px;
  font-size:18px;
  opacity:.8;
}
</style>
</head>

<body>

<div class="container">

  <h1>真相周邊抽選</h1>

  <p>
    完成現場付款 NT$280 後，<br>
    即可進行一次真相抽選。
  </p>

  <div class="slot" id="slot">
    等待配給中...
  </div>

  <button id="drawBtn" onclick="startDraw()">開始抽選</button>

  <div class="status" id="status">
    觀察系統待命中...
  </div>

</div>

<script>
const prizes = [
  "遊戲場景造型立牌｜光之室",
  "遊戲場景造型立牌｜破殼夢",
  "遊戲場景造型立牌｜格子籠",
  "遊戲場景造型立牌｜食槽前的抉擇",
  "遊戲場景造型立牌｜全員淘汰",

  "卡牌流沙吊飾｜行動卡牌",
  "卡牌流沙吊飾｜真相卡牌",
  "卡牌流沙吊飾｜幻覺卡牌",

  "角色插圖磁吸燈箱｜斷喙者・喀喀",
  "角色插圖磁吸燈箱｜編碼觀測者・C-98",
  "角色插圖磁吸燈箱｜失焦者・No.13",
  "角色插圖磁吸燈箱｜羽封者・小白",
  "角色插圖磁吸燈箱｜孵夢者・殼裡裡",
  "角色插圖磁吸燈箱｜語者・啼鳴零號"
];

function startDraw(){
  const slot = document.getElementById("slot");
  const status = document.getElementById("status");
  const btn = document.getElementById("drawBtn");

  btn.disabled = true;
  status.innerText = "真相碎片同步中...";

  let count = 0;
  const totalRolls = 35;

  const rolling = setInterval(() => {
    const randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
    slot.innerText = randomPrize;
    count++;

    if(count >= totalRolls){
      clearInterval(rolling);

      const finalPrize = prizes[Math.floor(Math.random() * prizes.length)];
      slot.innerHTML = "你獲得了：<br>" + finalPrize;

      status.innerText = "配給結果已確認，請向工作人員領取。";
      btn.innerText = "抽選完成";
    }
  }, 80);
}
</script>

</body>
</html>
